name: Permissions
description: Validate user permissions for the current repository & run the workflow.

inputs:
  ENVIRONMENT:
   required: true
   description: The environment to deploy to.
  DEPLOYMENT_PERMITTED:
   description: Comma separated list of users that are permitted to deploy.
   required: true
  DEPLOYMENT_REPOSITORY_OWNER:
   description: The repository owner to restrict.
   required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        DEPLOYMENT_REPOSITORY_OWNER: ${{ inputs.DEPLOYMENT_REPOSITORY_OWNER }}
        REPOSITORY_OWNER: ${{ github.event.repository.owner.login }}
        DEPLOYMENT_PERMITTED: ${{ inputs.DEPLOYMENT_PERMITTED }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        if [[ "$DEPLOYMENT_REPOSITORY_OWNER" != "$REPOSITORY_OWNER" ]];then
          echo "Pass validation outside of main repo owner"
          exit 0
        fi
        if [[ "$ENVIRONMENT" == "dev" ]];then
          echo "Pass validation in the development environment"
          exit 0
        fi
        permitted=",$(echo "$DEPLOYMENT_PERMITTED" | tr -d '[:space:]'),"
        actor=",${GITHUB_ACTOR},"
        if ! echo "$permitted" | grep -Fiq "$actor"; then
         echo "::error::No deployment permissions have been granted to the user : ${GITHUB_ACTOR}"
         exit 1
        fi
